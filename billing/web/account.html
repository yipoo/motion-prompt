<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion Prompt · 精品包与账户</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="studio/account.css"></head><body>
<header><a class="brand" href="./"><img src="assets/favicon.svg" width="34" height="34" alt="">motion <span>prompt</span></a><nav><a href="./" data-i18n="library">免费动效库</a><button id="language" type="button">EN</button></nav></header>
<main><section class="hero"><p class="eyebrow">MOTION PROMPT / PREMIUM</p><h1 data-i18n="headline">把动效灵感，变成完整设计。</h1><p class="intro" data-i18n="intro">免费库继续开放。精品包围绕真实页面，提供组合 prompt、示例代码和设计说明。</p><p id="environment" class="notice" role="status"></p></section>
<section id="products" class="products" aria-label="Products"></section>
<section class="account"><div><p class="eyebrow">YOUR WORKSPACE</p><h2 data-i18n="account">你的账户</h2><p data-i18n="accountIntro">登录后查看购买记录、下载精品包，或管理订阅和发票。</p></div><div>
<form id="email-form"><label for="email" data-i18n="email">邮箱</label><div class="input-row"><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"><button id="send-code" type="submit" data-i18n="sendCode">发送验证码</button></div></form>
<form id="code-form" hidden><label for="code" data-i18n="code">邮箱验证码</label><div class="input-row"><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required maxlength="10"><button type="submit" data-i18n="verify">登录</button></div></form>
<button id="github" type="button" class="secondary" hidden data-i18n="github">使用 GitHub 登录</button>
<div id="signed-in" hidden><p id="identity"></p><p id="entitlements"></p><div class="actions"><button id="portal" type="button" data-i18n="portal">管理订阅与发票</button><button id="sign-out" type="button" class="secondary" data-i18n="signOut">退出登录</button></div><div id="downloads"></div><div id="invoices"></div></div>
<p id="message" role="status" aria-live="polite"></p></div></section>
<p class="footnote" data-i18n="terms">单包包含所购版本；Pro 权益在订阅有效期内提供。下载后的文件按交付许可使用。现有 MIT 开源内容保持免费。</p>
</main><footer><span>Motion Prompt · yipoo</span><a href="mailto:dinglei2025@gmail.com" data-i18n="contact">联系作者</a></footer><script type="module" src="studio/account.js"></script></body></html>
